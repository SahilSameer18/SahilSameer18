<text class="m" font-size="13" fill="#DDD6C6"><tspan x="200" y="138"><tspan fill="#B8935A">◆</tspan>  Soft-delete trash with restore fallbacks; nested folders with cycle guards</tspan><tspan x="200" y="162"><tspan fill="#B8935A">◆</tspan>  JWT auth with token rotation; public share links</tspan><tspan x="200" y="186"><tspan fill="#B8935A">◆</tspan>  Presigned direct uploads, server-side search, multi-field sort and pagination</tspan></text>
