<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 250" width="1100" height="250" role="img" aria-label="InForge">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8A6A3B"/><stop offset=".5" stop-color="#E8CF9B"/><stop offset="1" stop-color="#B8935A"/></linearGradient>
<linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0C0F"/><stop offset="1" stop-color="#16130E"/></linearGradient>
<style>.s{font-family:Georgia,'Times New Roman',serif}.m{font-family:Consolas,'Courier New',monospace}</style></defs>
