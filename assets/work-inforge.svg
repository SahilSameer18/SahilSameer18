<text class="s" x="200" y="68" font-size="36" fill="url(#g)">InForge</text>
<text class="s" x="200" y="97" font-size="16" font-style="italic" fill="#CFC6B4">Event-driven Gmail safety &amp; automation platform.</text>
<text class="m" x="1056" y="62" font-size="12" letter-spacing="3" text-anchor="end" fill="#B8935A">SOURCE ↗</text>
<line x1="200" y1="112" x2="1056" y2="112" stroke="#B8935A" stroke-width=".5" opacity=".4"/>
<text class="m" font-size="13" fill="#DDD6C6"><tspan x="200" y="138"><tspan fill="#B8935A">◆</tspan>  Gmail Pub/Sub → BullMQ queue; email bodies are processed, never persisted</tspan><tspan x="200" y="162"><tspan fill="#B8935A">◆</tspan>  Gemini Flash-Lite cascade with Zod-validated structured output and failover</tspan><tspan x="200" y="186"><tspan fill="#B8935A">◆</tspan>  Draft-only by design: never sends mail; every mutation snapshotted to an audit log</tspan></text>
