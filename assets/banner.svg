<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Sahil Sameer Siddique — Backend-first Full Stack Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0C0F"/><stop offset="1" stop-color="#16130E"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A6A3B"/><stop offset=".5" stop-color="#E8CF9B"/><stop offset="1" stop-color="#B8935A"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#B8935A" stop-opacity=".22"/><stop offset="1" stop-color="#B8935A" stop-opacity="0"/>
    </radialGradient>
    <style>
      .serif{font-family:Georgia,'Times New Roman',serif}
      .mono{font-family:'SFMono-Regular',Consolas,'Courier New',monospace}
      .fade{opacity:0;animation:in 1.4s ease forwards}
      .d1{animation-delay:.2s}.d2{animation-delay:.7s}.d3{animation-delay:1.2s}
      @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
      .sweep{animation:sw 6s ease-in-out infinite}
      @keyframes sw{0%,100%{transform:translateX(-120px);opacity:.0}50%{transform:translateX(120px);opacity:.25}}
    </style>
  </defs>
  <rect width="1200" height="360" fill="url(#bg)"/>
  <circle cx="1000" cy="60" r="320" fill="url(#glow)"/>
  <rect x="24" y="24" width="1152" height="312" fill="none" stroke="url(#gold)" stroke-width="1" opacity=".55"/>
  <rect x="34" y="34" width="1132" height="292" fill="none" stroke="#B8935A" stroke-width=".5" opacity=".25"/>
  <text class="mono fade d1" x="600" y="104" text-anchor="middle" font-size="13" letter-spacing="7" fill="#B8935A">FULL STACK ENGINEER  ·  BACKEND-FIRST</text>
  <text class="serif fade d2" x="600" y="190" text-anchor="middle" font-size="68" letter-spacing="2" fill="url(#gold)">Sahil Sameer Siddique</text>
  <line x1="460" y1="222" x2="740" y2="222" stroke="url(#gold)" stroke-width="1" class="fade d3"/>
  <text class="serif fade d3" x="600" y="266" text-anchor="middle" font-size="20" font-style="italic" fill="#CFC6B4">Auth, validation &amp; architecture before pixels.</text>
  <rect class="sweep" x="540" y="30" width="2" height="300" fill="#E8CF9B"/>
</svg>
